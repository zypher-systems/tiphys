# Tiphys configuration: ~/.tiphys/config.toml, or $TIPHYS_HOME/config.toml.
#
# This file is yours. Tiphys reads it and never rewrites it. What you choose in
# the app is saved beside it in settings.toml, and where both set the same
# value, settings.toml wins.
#
# You do not need this file to get started: run `tiphys` and add a connection
# in the app. Keys are never written here. A key is entered in the app and
# stored in keys/<connection>, readable only by the Tiphys user.

# The connection a new session uses.
# default_connection = "openrouter"

# A connection is any endpoint that speaks Chat Completions. `model` is the
# id the endpoint lists for the model; the app's model picker fills it in.
# [connections.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# model = "vendor/model-id"

# A server on your own hardware needs no key. `local = true` says it costs
# nothing and gives it longer to answer, since it may load a model first.
# [connections.local]
# base_url = "http://127.0.0.1:11434/v1"
# model = "model-id"
# local = true

# A server that must start with nobody present can take its key from an
# environment variable instead of the app. Tiphys reads the variable and
# removes it from the environment of every command it runs.
# [connections.work]
# base_url = "https://api.openai.com/v1"
# model = "model-id"
# env_key = "WORK_API_KEY"

# Prices, in dollars per million tokens, by model id. Tiphys takes prices from
# a connection's model list where it has them; a price here wins over that,
# and prices a model that has none. A model with no known price costs $?.??.
# [pricing."vendor/model-id"]
# input = 3.0
# output = 15.0
# cache_read = 0.3
# cache_write = 3.75

# The bounds on one turn. A turn that reaches the round limit stops and says
# so; "continue" carries on. `max_tokens` caps a single reply and is left to
# the provider when unset.
# [limits]
# rounds = 40
# max_tokens = 8192

# What asks before it runs. Reads never ask. Anything outside Tiphys's own
# home, anything that needs root and any file that usually holds a secret
# always asks. Changes inside its own home run by default, because the machine
# exists for the agent; "ask" makes those ask as well.
# [approvals]
# change = "run"

# Who may talk to the daemon, by numeric user id, besides the user it runs as
# and root. `tiphys daemon install --owner <name>` fills this in.
# [daemon]
# owners = [1000]

# The command that starts the worker, which acts for the agent as another
# user. Installed, it is set for you. Left out, there is no worker, and
# Tiphys acts as the user it runs as.
# worker = ["sudo", "-n", "-H", "-u", "tiphys", "/usr/local/bin/tiphys", "worker"]

# The most that may be spent on model calls in one day, in dollars, across
# every session. A turn stops when the day's total has reached it, and says
# so. Days are UTC. 0 means no limit. A call whose price is not known cannot
# be counted, and is not.
# [spend]
# daily_usd = 5.0
